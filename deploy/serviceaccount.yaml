# 本服务用来访问集群的身份。
#
# 显式写出 automountServiceAccountToken 而不是依赖默认值：本服务的全部集群调用
# （TokenReview / SubjectAccessReview / 读 Pod 和日志 / helm 读写 release Secret）
# 都靠这个 token。哪天集群层面把默认值改成 false，问题会立刻指向这里，
# 而不是表现为一堆「连不上 API Server」的 503。
#
# token 由 kubelet 自动挂载并轮换（app/k8s/client.py 用的是 load_incluster_config，
# 它的 refresh_api_key_hook 会跟着更新）——所以**不要**手写 Authorization 头，
# 那等于把这个自动轮换机制绕过去。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ops-api
  namespace: k8s-ops-api
automountServiceAccountToken: true
